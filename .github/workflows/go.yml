name: "Go"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: "${{ github.event.action != 'merge_group' }}"

jobs:
  build:
    name: "Build"
    uses: HyperaDev/actions/.github/workflows/go-build.yml@beddc3665d0e5acb585777857b14115017633dd0 # main
    with:
      go_version: "stable"
      lint_enabled: true
      vulncheck_enabled: true
